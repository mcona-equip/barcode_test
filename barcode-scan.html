<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>바코드 스캔 (OCR)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 20px;
    }

    #header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(0,0,0,0.8);
      z-index: 10;
    }
    #header h1 { font-size: 16px; font-weight: 600; }
    #btn-close {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      font-size: 14px;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* 메인 영역 */
    #main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 340px;
      margin-top: 56px;
    }

    #guide-box {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px dashed rgba(255,255,255,0.2);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #guide-box svg { opacity: 0.5; }
    #guide-text {
      font-size: 13px;
      color: rgba(255,255,255,0.55);
      line-height: 1.6;
    }

    /* 촬영 버튼 */
    #btn-capture {
      width: 100%;
      padding: 18px;
      background: #22c55e;
      border: none;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      touch-manipulation: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    #btn-capture:active { background: #16a34a; }
    #btn-capture:disabled {
      background: #374151;
      cursor: not-allowed;
    }

    #btn-manual {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    /* OCR 진행 중 */
    #loading-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      text-align: center;
    }
    #loading-view.show { display: flex; }
    #spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text { font-size: 14px; color: rgba(255,255,255,0.7); }

    /* 미리보기 */
    #preview-wrap {
      display: none;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    #preview-wrap.show { display: block; }
    #preview-img {
      width: 100%;
      max-height: 200px;
      object-fit: contain;
    }

    /* 결과 */
    #result-view {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 100%;
      text-align: center;
    }
    #result-view.show { display: flex; }
    #result-label { font-size: 12px; color: rgba(255,255,255,0.5); }
    #result-value {
      font-size: 24px;
      font-weight: 700;
      color: #22c55e;
      word-break: break-all;
    }
    #btn-confirm {
      width: 100%;
      padding: 16px;
      background: #22c55e;
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
    }
    #btn-confirm:active { background: #16a34a; }
    #btn-retry {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    /* 상태 메시지 */
    #status-msg {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>바코드 스캔 (OCR)</h1>
  <button id="btn-close">닫기</button>
</div>

<div id="main">

  <!-- 기본 화면 -->
  <div id="guide-box">
    <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M3 9V6a1 1 0 011-1h3M3 15v3a1 1 0 001 1h3m11-4v3a1 1 0 01-1 1h-3m4-12h-3a1 1 0 00-1 1v3
           M7 12h10M12 7v10"/>
    </svg>
    <p id="guide-text">카메라로 바코드 아래 숫자/문자를<br>선명하게 찍으면 자동으로 인식합니다</p>
  </div>

  <!-- 이미지 미리보기 -->
  <div id="preview-wrap">
    <img id="preview-img" alt="촬영 이미지" />
  </div>

  <!-- OCR 진행 중 -->
  <div id="loading-view">
    <div id="spinner"></div>
    <div id="loading-text">OCR 분석 중...</div>
  </div>

  <!-- 결과 -->
  <div id="result-view">
    <div id="result-label">인식 결과</div>
    <div id="result-value"></div>
    <button id="btn-confirm">이 값으로 조회</button>
    <button id="btn-retry">다시 촬영</button>
  </div>

  <!-- 촬영 버튼 -->
  <button id="btn-capture">
    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
      <circle cx="12" cy="13" r="3" stroke-width="2"/>
    </svg>
    카메라로 촬영
  </button>

  <button id="btn-manual">직접 입력</button>

  <div id="status-msg">OCR 엔진 로딩 중...</div>
</div>

<!-- 숨김 파일 입력 (네이티브 카메라) -->
<input id="file-input" type="file" accept="image/*" capture="environment" style="display:none" />
<!-- OCR 처리용 캔버스 -->
<canvas id="ocr-canvas" style="display:none"></canvas>

<script>
  const fileInput   = document.getElementById('file-input');
  const ocrCanvas   = document.getElementById('ocr-canvas');
  const ocrCtx      = ocrCanvas.getContext('2d');
  const previewWrap = document.getElementById('preview-wrap');
  const previewImg  = document.getElementById('preview-img');
  const loadingView = document.getElementById('loading-view');
  const loadingText = document.getElementById('loading-text');
  const resultView  = document.getElementById('result-view');
  const resultValue = document.getElementById('result-value');
  const btnCapture  = document.getElementById('btn-capture');
  const statusMsg   = document.getElementById('status-msg');

  let worker = null;
  let workerReady = false;
  let scannedValue = null;

  const openerOrigin = document.referrer ? new URL(document.referrer).origin : '*';

  /* ── 팝업 닫기 / 결과 전송 ── */
  function closePopup() {
    if (worker) worker.terminate();
    window.close();
  }

  function sendResult(value) {
    if (worker) worker.terminate();
    if (window.opener) {
      window.opener.postMessage(
        { type: 'BARCODE_RESULT', barcode: value },
        openerOrigin === '' ? '*' : openerOrigin
      );
    }
    window.close();
  }

  document.getElementById('btn-close').addEventListener('click', closePopup);

  document.getElementById('btn-confirm').addEventListener('click', () => sendResult(scannedValue));

  document.getElementById('btn-retry').addEventListener('click', () => {
    resultView.classList.remove('show');
    previewWrap.classList.remove('show');
    fileInput.value = '';
    fileInput.click();
  });

  document.getElementById('btn-manual').addEventListener('click', () => {
    const val = prompt('S/N 또는 MAC 주소를 직접 입력하세요:');
    if (val && val.trim()) sendResult(val.trim().toUpperCase());
  });

  /* ── 촬영 버튼 ── */
  btnCapture.addEventListener('click', () => {
    fileInput.click();
  });

  /* ── 이미지 선택 시 OCR 실행 ── */
  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    // 미리보기
    const objectUrl = URL.createObjectURL(file);
    previewImg.src = objectUrl;
    previewWrap.classList.add('show');
    resultView.classList.remove('show');

    // OCR 준비 안 됐으면 대기
    if (!workerReady) {
      loadingView.classList.add('show');
      loadingText.textContent = 'OCR 엔진 준비 중... 잠시 기다려주세요';
      await waitForWorker();
    }

    loadingView.classList.add('show');
    loadingText.textContent = 'OCR 분석 중...';

    try {
      // 이미지 → 캔버스 전처리
      const img = await loadImage(objectUrl);
      URL.revokeObjectURL(objectUrl);
      preprocessImage(img);

      // OCR 실행
      const { data: { text } } = await worker.recognize(ocrCanvas);

      const cleaned = text
        .replace(/\s+/g, '')
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, '');

      const serialMatch = cleaned.match(/[A-Z0-9]{10,16}/);

      loadingView.classList.remove('show');

      if (serialMatch) {
        scannedValue = serialMatch[0];
        resultValue.textContent = scannedValue;
        resultView.classList.add('show');
      } else {
        alert('문자를 인식하지 못했습니다.\n바코드 아래 숫자/문자 부분을 더 가까이, 선명하게 찍어주세요.');
        previewWrap.classList.remove('show');
        fileInput.value = '';
      }
    } catch (e) {
      loadingView.classList.remove('show');
      alert('OCR 처리 중 오류가 발생했습니다. 다시 시도해주세요.');
      previewWrap.classList.remove('show');
      fileInput.value = '';
    }
  });

  /* ── 이미지 로드 헬퍼 ── */
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  /* ── 캔버스 전처리 (그레이스케일 + 이진화) ── */
  function preprocessImage(img) {
    // 긴 쪽을 1600px로 제한 (너무 크면 OCR 느림)
    const MAX = 1600;
    let w = img.naturalWidth, h = img.naturalHeight;
    if (w > MAX || h > MAX) {
      if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
      else       { w = Math.round(w * MAX / h); h = MAX; }
    }

    ocrCanvas.width  = w;
    ocrCanvas.height = h;
    ocrCtx.drawImage(img, 0, 0, w, h);

    const imgData = ocrCtx.getImageData(0, 0, w, h);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      const bin  = gray > 128 ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = bin;
    }
    ocrCtx.putImageData(imgData, 0, 0);
  }

  /* ── Worker 준비 대기 ── */
  function waitForWorker() {
    return new Promise(resolve => {
      const check = setInterval(() => {
        if (workerReady) { clearInterval(check); resolve(); }
      }, 200);
    });
  }

  /* ── Tesseract 동적 로드 + 초기화 ── */
  function loadTesseractScript() {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  async function initWorker() {
    try {
      await loadTesseractScript();
      worker = await Tesseract.createWorker('eng', 1, {
        logger: m => {
          if (m.status === 'loading tesseract core' || m.status === 'initializing tesseract') {
            statusMsg.textContent = `OCR 엔진 초기화 중... ${Math.round((m.progress || 0) * 100)}%`;
          }
        },
      });
      await worker.setParameters({
        tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
        tessedit_pageseg_mode: '7',
      });
      workerReady = true;
      statusMsg.textContent = 'OCR 준비 완료';
    } catch {
      statusMsg.textContent = 'OCR 로드 실패 — 직접 입력을 사용하세요.';
    }
  }

  initWorker();

  // 팝업 열리자마자 카메라 자동 실행 (부모 창 버튼 클릭 제스처 전파)
  window.addEventListener('load', () => {
    fileInput.click();
  });
</script>
</body>
</html>
